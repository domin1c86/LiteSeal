[package]
name = "liteseal-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = { workspace = true }
futures-util = "0.3"
liteseal-shared = { path = "../shared" }
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
