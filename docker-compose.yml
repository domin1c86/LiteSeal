services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liteseal
      POSTGRES_USER: ${POSTGRES_USER:-liteseal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteseal -d liteseal"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-liteseal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/liteseal
      LITESEAL_BIND: 0.0.0.0:3000
      LITESEAL_CORS_ALLOW_ORIGIN: ${LITESEAL_CORS_ALLOW_ORIGIN:?LITESEAL_CORS_ALLOW_ORIGIN must be set}
      LITESEAL_BOOTSTRAP_INVITE_CODE: ${LITESEAL_BOOTSTRAP_INVITE_CODE:?LITESEAL_BOOTSTRAP_INVITE_CODE must be set}
      RUST_LOG: info,tower_http=info,liteseal_server=debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

volumes:
  postgres-data:
