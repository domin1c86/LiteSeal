services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: liteseal
      POSTGRES_USER: liteseal
      POSTGRES_PASSWORD: liteseal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liteseal -d liteseal"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://liteseal:liteseal@postgres:5432/liteseal
      LITESEAL_BIND: 0.0.0.0:3000
      LITESEAL_CORS_ALLOW_ORIGIN: http://localhost:1420
      RUST_LOG: info,tower_http=info,liteseal_server=debug
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
