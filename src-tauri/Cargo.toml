[package]
name = "liteseal-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "liteseal_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
liteseal-core = { path = "../core" }
liteseal-shared = { path = "../shared" }
dirs = "5"
tracing-subscriber = "0.3"
